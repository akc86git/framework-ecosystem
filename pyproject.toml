[project]
name = "framework-ecosystem"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncio>=4.0.0",
    "dataclasses>=0.8",
    "datetime>=6.0",
    "httpx>=0.28.1",
    "rich>=15.0.0",
    "tenacity>=9.2.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"                      # тесты без @pytest.mark.asyncio
asyncio_default_fixture_loop_scope = "function"